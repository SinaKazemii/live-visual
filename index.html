<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe Music Gallery</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        color: white;
        overflow: hidden;
        font-family: Tahoma;
    }

    .container {
        display: flex;
        width: 300vw; /* به تعداد صفحات */
        height: 100vh;
        transition: transform 0.4s ease;
    }

    .page {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }

    /* عکس مربعی و ریسپانسیو */
    .image-box {
        width: min(80vw, 80vh);
        aspect-ratio: 1 / 1;
        overflow: hidden;
        border-radius: 12px;
    }

    .image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* پلیر موسیقی */
    audio {
        width: 80%;
        max-width: 350px;
    }
</style>
</head>

<body>

<div class="container" id="container">

    <div class="page">
        <div class="image-box">
            <img src="1.jpg">
        </div>
        <audio controls>
            <source src="1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="page">
        <div class="image-box">
            <img src="2.jpg">
        </div>
        <audio controls>
            <source src="2.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="page">
        <div class="image-box">
            <img src="image3.jpg">
        </div>
        <audio controls>
            <source src="music3.mp3" type="audio/mpeg">
        </audio>
    </div>

</div>

<script>
let container = document.getElementById("container");
let startX = 0;
let currentPage = 0;
const totalPages = 3;

document.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if (diff > 50 && currentPage < totalPages - 1) currentPage++;
    if (diff < -50 && currentPage > 0) currentPage--;

    container.style.transform = `translateX(-${currentPage * 100}vw)`;
});
</script>

</body>
</html>
